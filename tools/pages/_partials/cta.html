<section class="reach-section" aria-labelledby="cta-title">
  <div class="wrap">
    <div class="reach reveal">
      <div class="reach__intro">
        <p class="eyebrow">اطلب عرض سعر</p>
        <h2 class="h2" id="cta-title">تحتاج سعرًا أو كمية معيّنة؟</h2>
        <p class="dim">أخبرنا بالمادة والكمية، ونردّ عليك بالسعر الحالي ومواصفات الشحنة المتوفرة.</p>
        <p class="reach__place">{{icon:pin}}<a href="{{map}}" target="_blank" rel="noopener">{{city}}</a></p>
      </div>
      <ul class="reach__list" role="list">
        <li>
          <a class="reach__row reach__row--main" href="tel:{{phone}}">
            <span class="reach__icon">{{icon:phone}}</span>
            <span class="reach__text"><span class="reach__k">اتصل بنا</span><span class="reach__v latin">{{phone_display}}</span></span>
            <span class="reach__go" aria-hidden="true">←</span>
          </a>
        </li>
        <li>
          <a class="reach__row" href="https://wa.me/{{whatsapp}}" target="_blank" rel="noopener">
            <span class="reach__icon reach__icon--wa">{{icon:whatsapp}}</span>
            <span class="reach__text"><span class="reach__k">واتساب</span><span class="reach__v">راسلنا في أي وقت</span></span>
            <span class="reach__go" aria-hidden="true">←</span>
          </a>
        </li>
        <li>
          <a class="reach__row" href="{{base}}contact.html">
            <span class="reach__icon">{{icon:doc}}</span>
            <span class="reach__text"><span class="reach__k">نموذج الطلب</span><span class="reach__v">اترك رسالة ونعاود الاتصال بك</span></span>
            <span class="reach__go" aria-hidden="true">←</span>
          </a>
        </li>
      </ul>
    </div>
  </div>
</section>
